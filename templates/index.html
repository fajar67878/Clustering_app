<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clustering App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4">Aplikasi Clustering K-Means</h2>
        <form action="/process" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Upload File CSV Data Studi Kasus:</label>
                <input type="file" name="file" class="form-control" accept=".csv" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Jumlah Cluster (K):</label>
                <input type="number" name="k_value" class="form-control" value="3" min="1" max="10">
            </div>
            <button type="submit" class="btn btn-primary w-100">Proses Clustering</button>
        </form>
    </div>
</body>
</html>
